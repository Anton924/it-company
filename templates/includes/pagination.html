{% load query_transform %}

{% if is_paginated %}
<div class="d-flex flex-column flex-md-row justify-content-between align-items-center px-4 py-1">
    <div class="mb-3 mb-md-0">
        <p class="text-sm text-secondary mb-0">
            Showing page <span class="font-weight-bolder text-dark">{{ page_obj.number }}</span>
            of <span class="font-weight-bolder text-dark">{{ page_obj.paginator.num_pages }}</span>
        </p>
    </div>

    <nav aria-label="Table navigation">
        <ul class="pagination pagination-sm mb-0 align-items-center">

            <li class="page-item {% if not page_obj.has_previous %}disabled opacity-3{% endif %}">
                <a class="page-link border-0 bg-transparent py-0" href="?{% query_transform request page=1 %}" title="First Page">
                    <i class="material-symbols-rounded">first_page</i>
                </a>
            </li>

            <li class="page-item {% if not page_obj.has_previous %}disabled opacity-3{% endif %}">
                <a class="page-link border-0 bg-transparent py-0"
                   href="{% if page_obj.has_previous %}?{% query_transform request page=page_obj.previous_page_number %}{% else %}#{% endif %}">
                    <i class="material-symbols-rounded">chevron_left</i>
                </a>
            </li>

            <li class="page-item mx-1">
                <span class="badge badge-sm bg-gradient-dark rounded-pill px-3 shadow-dark">
                    {{ page_obj.number }}
                </span>
            </li>

            <li class="page-item {% if not page_obj.has_next %}disabled opacity-3{% endif %}">
                <a class="page-link border-0 bg-transparent py-0"
                   href="{% if page_obj.has_next %}?{% query_transform request page=page_obj.next_page_number %}{% else %}#{% endif %}">
                    <i class="material-symbols-rounded">chevron_right</i>
                </a>
            </li>

            <li class="page-item {% if not page_obj.has_next %}disabled opacity-3{% endif %}">
                <a class="page-link border-0 bg-transparent py-0"
                   href="?{% query_transform request page=page_obj.paginator.num_pages %}" title="Last Page">
                    <i class="material-symbols-rounded">last_page</i>
                </a>
            </li>

        </ul>
    </nav>
</div>
{% endif %}
